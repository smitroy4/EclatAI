spring:
  application:
    name: eclat-ai
    title: Eclat AI
    version: 0.0.1

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO}
    properties:
      hibernate:
    show-sql: ${HIBERNATE_SHOW_SQL}